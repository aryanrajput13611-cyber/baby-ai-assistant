plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.baby.baby_assistant"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.baby.baby_assistant"
        minSdk = 21
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

// यह ब्लॉक सभी पुराने प्लगइन्स को compileSdk दे देगा बिना किसी क्रैश के
gradle.beforeProject { project ->
    project.ext.set("flutter.compileSdkVersion", 34)
    project.ext.set("flutter.minSdkVersion", 21)
    project.ext.set("flutter.targetSdkVersion", 34)
}
