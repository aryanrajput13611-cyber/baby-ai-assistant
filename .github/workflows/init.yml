name: Setup Flutter Project

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter Base
        run: |
          flutter create --org com.baby --project-name baby_assistant temp_app
          shopt -s dotglob
          mv temp_app/* .
          rm -rf temp_app
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Initialize complete Flutter project structure"
          git push
